<title>Brew Blitz</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=DM+Sans:wght@400;500;700&display=swap">
<style>
/* Committed neon-arcade look (single theme by design). Layout: a centered cabinet screen with HUD, question, 2x2 answers; state-switched. */
:root{
  --bg:#080a16; --bg2:#0f1330; --panel:#141a3a; --panel2:#1b2350;
  --ink:#eaf1ff; --muted:#8e9bd6; --line:#2a3570;
  --cyan:#29e7e7; --pink:#ff4fa3; --gold:#ffd23f; --green:#4dffb0; --purple:#b483ff; --red:#ff5d6c;
  --display:"Press Start 2P",monospace; --body:"DM Sans",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(1000px 600px at 50% -5%,#1a2050 0%,var(--bg) 60%);color:var(--ink);
  font-family:var(--body);line-height:1.5;overflow-x:hidden}
/* scanlines */
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;opacity:.5;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px)}
.wrap{min-height:100%;display:flex;align-items:center;justify-content:center;
  padding:26px max(16px,env(safe-area-inset-left,0px)) 44px;padding-right:max(16px,env(safe-area-inset-right,0px))}
.cab{width:100%;max-width:640px;position:relative;z-index:1}
.screen[hidden]{display:none!important}
@keyframes shake{10%,90%{transform:translateX(-3px)}30%,70%{transform:translateX(6px)}50%{transform:translateX(-9px)}}
.cab.shake{animation:shake .4s}
@keyframes flashg{0%{box-shadow:0 0 0 0 var(--green)}100%{box-shadow:0 0 0 0 transparent}}

/* arcade buttons */
.abtn{font-family:var(--display);font-size:13px;line-height:1.5;border:2px solid var(--cyan);background:#0c1030;
  color:var(--cyan);border-radius:10px;padding:14px 18px;cursor:pointer;text-transform:uppercase;letter-spacing:1px;
  box-shadow:0 0 0 0 var(--cyan);transition:box-shadow .15s,transform .06s,background .15s}
.abtn:hover{box-shadow:0 0 16px -2px var(--cyan);background:#121845}
.abtn:active{transform:translateY(2px)}
.abtn.pink{border-color:var(--pink);color:var(--pink)}.abtn.pink:hover{box-shadow:0 0 16px -2px var(--pink)}
.abtn:focus-visible{outline:3px solid var(--gold);outline-offset:3px}

/* start */
#start{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.logo{font-family:var(--display);font-size:clamp(30px,8vw,52px);color:var(--gold);line-height:1.08;margin:6px 0 2px;
  text-shadow:0 0 18px rgba(255,210,63,.5),4px 4px 0 var(--pink)}
.tagline{font-family:var(--display);font-size:11px;color:var(--cyan);letter-spacing:3px;margin-bottom:6px}
.blurb{color:var(--muted);font-size:15.5px;max-width:46ch;margin:2px auto 14px}
.stagehdr{font-family:var(--display);font-size:12px;color:var(--pink);letter-spacing:2px;margin:12px 0 4px}
.stages{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
@media (max-width:460px){.stages{grid-template-columns:1fr}}
.stage{text-align:left;border:2px solid var(--line);background:var(--panel);border-radius:12px;padding:14px 16px;cursor:pointer;
  display:flex;align-items:center;gap:12px;transition:border-color .14s,transform .07s,box-shadow .15s}
.stage:hover{transform:translateY(-2px)}
.stage:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.stage .num{font-family:var(--display);font-size:13px;width:34px;height:34px;flex:none;display:grid;place-items:center;border-radius:8px;color:#0b0e1a}
.stage .nm{font-weight:700;font-size:15.5px;line-height:1.15}
.stage .ct{font-size:12px;color:var(--muted);margin-top:2px}
.wide{display:flex;gap:10px;margin-top:10px;width:100%}
.wide .abtn{flex:1;text-align:center}
.hiscore{font-family:var(--display);font-size:10px;color:var(--gold);margin-top:16px;letter-spacing:1px}
.coin{font-family:var(--display);font-size:11px;color:var(--muted);margin-top:4px;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:.25}}

/* HUD */
.hud{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;font-family:var(--display);font-size:11px}
.hud .lbl{color:var(--muted);font-size:9px;letter-spacing:1px}
.hud .val{color:var(--cyan);font-size:15px;margin-top:4px}
.hud .score .val{color:var(--gold)}
.hud .combo .val{color:var(--pink)}
.combo.big .val{text-shadow:0 0 12px var(--pink)}
.tbar{height:8px;background:var(--panel);border:1px solid var(--line);border-radius:999px;overflow:hidden;margin-bottom:16px}
.tbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--green),var(--cyan));transition:width .1s linear}
.tbar i.low{background:linear-gradient(90deg,var(--gold),var(--red))}
.subtag{font-family:var(--display);font-size:9px;letter-spacing:2px;margin-bottom:10px}
.qtext{font-weight:700;font-size:clamp(19px,3.8vw,24px);line-height:1.34;margin:0 0 18px;text-wrap:pretty;min-height:2.6em}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:11px}
@media (max-width:520px){.opts{grid-template-columns:1fr}}
.opt{display:flex;align-items:center;gap:12px;text-align:left;border:2px solid var(--line);background:var(--panel);color:var(--ink);
  border-radius:12px;padding:15px 15px;font-family:var(--body);font-size:16px;font-weight:500;line-height:1.3;cursor:pointer;
  transition:border-color .12s,transform .07s,box-shadow .15s;min-height:62px}
.opt:hover:not(:disabled){border-color:var(--cyan);box-shadow:0 0 14px -4px var(--cyan)}
.opt:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.opt:disabled{cursor:default}
.opt .k{flex:none;width:28px;height:28px;border-radius:7px;background:var(--panel2);display:grid;place-items:center;
  font-family:var(--display);font-size:11px;color:var(--cyan)}
.opt.correct{border-color:var(--green);background:#11351f;box-shadow:0 0 18px -4px var(--green)}
.opt.correct .k{background:var(--green);color:#06130b}
.opt.wrong{border-color:var(--red);background:#331016}
.opt.wrong .k{background:var(--red);color:#1a0509}
.opt.dim{opacity:.4}
.fb{margin-top:16px;border:2px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--panel);
  display:flex;flex-direction:column;gap:12px}
.fb.good{border-color:var(--green)}.fb.bad{border-color:var(--red)}
.fb .verdict{font-family:var(--display);font-size:13px}
.fb.good .verdict{color:var(--green)}.fb.bad .verdict{color:var(--red)}
.fb .ex{font-size:15px;line-height:1.5;color:var(--ink)}
.fb .nx{align-self:flex-end}
.float{position:fixed;font-family:var(--display);font-size:20px;color:var(--gold);pointer-events:none;z-index:60;
  text-shadow:0 0 10px var(--gold);animation:fl 1s ease forwards}
@keyframes fl{0%{opacity:0;transform:translateY(6px) scale(.7)}20%{opacity:1}100%{opacity:0;transform:translateY(-42px) scale(1.15)}}

/* results */
#results{text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.go{font-family:var(--display);font-size:clamp(24px,6vw,40px);color:var(--pink);text-shadow:0 0 18px rgba(255,79,163,.5);margin:4px 0}
.rank{font-family:var(--display);font-size:clamp(20px,5vw,30px);color:var(--gold);text-shadow:0 0 16px rgba(255,210,63,.5)}
.rankmsg{color:var(--muted);font-size:15px;max-width:38ch;margin:2px auto 6px}
.fin{font-family:var(--display);font-size:42px;color:var(--cyan);text-shadow:0 0 16px rgba(41,231,231,.5);margin:6px 0}
.rstats{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:8px 0}
.rstat{border:2px solid var(--line);background:var(--panel);border-radius:10px;padding:10px 16px;min-width:90px}
.rstat .v{font-family:var(--display);font-size:15px;color:var(--gold)}
.rstat .l{font-size:10px;letter-spacing:1px;color:var(--muted);text-transform:uppercase;margin-top:5px}
.newhi{font-family:var(--display);font-size:11px;color:var(--green);animation:blink 1s steps(1) infinite}
.rrow{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:14px}
canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
.foot{margin-top:22px;font-size:11px;color:var(--muted);text-align:center;font-family:var(--display);letter-spacing:1px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>

<canvas id="fx"></canvas>
<div class="wrap"><div class="cab" id="cab">

  <section class="screen" id="start">
    <div class="tagline">YEAST &amp; FERMENTATION</div>
    <h1 class="logo">BREW<br>BLITZ</h1>
    <p class="blurb">Beat the clock, build a combo, and prove you know your yeast. Pick a stage to begin.</p>
    <div class="stagehdr">&#9654; SELECT STAGE</div>
    <div class="stages" id="stages"></div>
    <div class="wide">
      <button class="abtn pink" id="mixBtn">Quick Mix &middot; 15</button>
      <button class="abtn pink" id="allBtn">Marathon &middot; 50</button>
    </div>
    <div class="hiscore" id="hi"></div>
    <div class="coin">&#9654; press a stage to insert coin</div>
    <button class="abtn" id="sound" style="margin-top:12px;font-size:10px;padding:8px 12px">&#128266; sound: on</button>
  </section>

  <section class="screen" id="game" hidden>
    <div class="hud">
      <div class="q"><div class="lbl">STAGE</div><div class="val" id="qnum">1/10</div></div>
      <div class="combo"><div class="lbl">COMBO</div><div class="val" id="combo">x1</div></div>
      <div class="score"><div class="lbl">SCORE</div><div class="val" id="score">0</div></div>
    </div>
    <div class="tbar"><i id="tbar"></i></div>
    <div class="subtag" id="subtag"></div>
    <h2 class="qtext" id="qtext"></h2>
    <div class="opts" id="opts"></div>
    <div class="fb" id="fb" hidden>
      <span class="verdict" id="verdict"></span>
      <span class="ex" id="ex"></span>
      <button class="abtn nx" id="nx" style="font-size:11px;padding:11px 16px">Next &#9654;</button>
    </div>
  </section>

  <section class="screen" id="results" hidden>
    <div class="go">GAME OVER</div>
    <div class="rank" id="rank"></div>
    <p class="rankmsg" id="rankmsg"></p>
    <div class="fin" id="fin">0</div>
    <div class="rstats">
      <div class="rstat"><div class="v" id="rAcc">0%</div><div class="l">Accuracy</div></div>
      <div class="rstat"><div class="v" id="rCombo">x0</div><div class="l">Best combo</div></div>
      <div class="rstat"><div class="v" id="rRight">0/0</div><div class="l">Correct</div></div>
    </div>
    <div class="newhi" id="newhi" hidden>&#9733; NEW HIGH SCORE &#9733;</div>
    <div class="rrow">
      <button class="abtn" id="again">Play Again</button>
      <button class="abtn pink" id="home">Change Stage</button>
    </div>
  </section>

  <div class="foot">BBMB 1200 &middot; CHEMISTRY OF BEER</div>
</div></div>

<script>
"use strict";
const $=s=>document.querySelector(s);
const SUB=["Microbes & Taxonomy","Sugars & Fermentation","Oxygen, Lipids & Esters","Sulfur & Water","GMOs & Engineering"];
const DOT=["#29e7e7","#b483ff","#4dffb0","#ffd23f","#ff4fa3"];
const Q=[
 {s:0,q:"Ale yeast — the classic brewer's yeast — is which species?",a:["Saccharomyces cerevisiae","Saccharomyces pastorianus","Saccharomyces eubayanus","Schizosaccharomyces pombe"],k:0,e:"Ale yeast is S. cerevisiae: warmer, top-fermenting. Lager yeast is the cooler, bottom-fermenting S. pastorianus."},
 {s:0,q:"Lager yeast, S. pastorianus, is a hybrid. Which wild parent was traced to Patagonia?",a:["Saccharomyces eubayanus","Saccharomyces paradoxus","Saccharomyces bayanus","Saccharomyces mikatae"],k:0,e:"S. eubayanus, a cold-tolerant wild species, is the non-cerevisiae half of lager yeast — likely imported to Europe via trans-Atlantic trade."},
 {s:0,q:"How many copies of each chromosome does lager yeast carry?",a:["Four (tetraploid)","One (haploid)","Two (diploid)","Three (triploid)"],k:0,e:"S. pastorianus is an allotetraploid hybrid: four chromosome sets from fusing an ale yeast with S. eubayanus."},
 {s:0,q:"The 'extremophiles' — thermophiles, halophiles, acidophiles — belong to which domain?",a:["Archaea","Bacteria","Eukarya","Fungi"],k:0,e:"Archaea include the extremophiles that thrive in harsh conditions resembling the early Earth."},
 {s:0,q:"Yeast sit in which phylum of the Kingdom Fungi?",a:["Ascomycetes","Basidiomycetes","Zygomycetes","Chytrids"],k:0,e:"Yeast are Ascomycetes. Basidiomycetes are the mushrooms; Zygomycetes include the bread molds."},
 {s:0,q:"Gram-positive bacteria retain the purple stain because they have:",a:["A thick peptidoglycan cell wall","An outer lipid membrane","No cell wall","More flagella"],k:0,e:"The thick peptidoglycan layer traps the crystal-violet dye; Gram-negatives hold less and don't retain it."},
 {s:0,q:"By endosymbiotic theory, mitochondria began as:",a:["Free-living aerobic prokaryotes","Infoldings of the cell membrane","Photosynthetic prokaryotes","Ancient viruses"],k:0,e:"Mitochondria descend from engulfed aerobic prokaryotes; chloroplasts from photosynthetic ones."},
 {s:0,q:"Brettanomyces contributes aromas usually described as:",a:["Funky — barnyard, horse blanket","Banana and bubblegum","Clove and smoke","Buttery and nutty"],k:0,e:"'Brett' gives funky notes: barnyard, horse blanket, wet straw — divisive, but prized in some styles."},
 {s:0,q:"Rod-shaped bacteria such as Lactobacillus are classified by which form name?",a:["Bacillus","Coccus","Spirillum","Vibrio"],k:0,e:"Bacillus = rod, coccus = sphere (Pediococcus), spirillum = spiral (e.g. Helicobacter)."},
 {s:0,q:"A homofermentative Lactobacillus produces mainly:",a:["Lactic acid","Ethanol","Acetic acid","Carbon dioxide"],k:0,e:"Homofermentative Lactobacilli make mainly lactic acid; heterofermentative ones also make acetic acid, ethanol and CO2."},
 {s:1,q:"The main sugar in wort (~55%) is:",a:["Maltose","Glucose","Sucrose","Maltotriose"],k:0,e:"Wort is ~55% maltose, the product of β-amylase on starch, plus ~10% glucose and ~11% maltotriose."},
 {s:1,q:"Maltose is built from:",a:["Two glucose units","Glucose + fructose","Two fructose units","Glucose + galactose"],k:0,e:"Maltose = two glucose units joined by an α-1,4 bond."},
 {s:1,q:"Which enzyme hydrolyzes maltose into glucose inside the cell?",a:["Maltase (α-1,4-glucosidase)","β-amylase","Invertase","Lactase"],k:0,e:"Maltase, or α-1,4-glucosidase, splits intracellular maltose into two glucose units for glycolysis."},
 {s:1,q:"How does maltose cross the yeast cell membrane?",a:["Active transport (proton symport, uses ATP)","Simple passive diffusion","Facilitated diffusion, no energy","Endocytosis"],k:0,e:"Maltose rides an ATP-powered proton symporter against its gradient. Glucose uses energy-free facilitated diffusion."},
 {s:1,q:"The net ATP yield of glycolysis is:",a:["2 ATP","4 ATP","28 ATP","0 ATP"],k:0,e:"Glycolysis spends 2 ATP and makes 4 — a net gain of 2 — and needs no oxygen."},
 {s:1,q:"The main purpose of alcoholic fermentation is to:",a:["Regenerate NAD+ from NADH","Produce most of the cell's ATP","Make CO2 for carbonation","Build cell membranes"],k:0,e:"Fermentation reoxidizes NADH to NAD+ so glycolysis can continue; ethanol is where the electrons end up."},
 {s:1,q:"The Crabtree effect is yeast's tendency to:",a:["Ferment even with oxygen present, if sugar is available","Respire whenever sugar is high","Stop growing in oxygen","Ferment only when sugar is absent"],k:0,e:"Brewer's yeast repress respiration in favor of fermentation when fermentable sugar is around — even with oxygen present."},
 {s:1,q:"Respiration yields roughly how many ATP, versus fermentation's 2?",a:["~28","~4","~10","~2 (the same)"],k:0,e:"Respiration nets ~28 ATP vs. 2 for fermentation. Yeast still ferment — trading efficiency for speed and ethanol as a weapon against competitors."},
 {s:1,q:"Above roughly what glucose concentration does the Crabtree effect switch on?",a:["0.4% (w/v)","4%","0.04%","10%"],k:0,e:"Above ~0.4% glucose. Normal wort starts above 1%, so yeast ferment from the start — and the oxygen is gone before glucose drops that low."},
 {s:1,q:"While glucose is plentiful, yeast switch off the maltose genes. This control is:",a:["Glucose (catabolite) repression","Feedback inhibition of an enzyme","Protein denaturation","Facilitated diffusion"],k:0,e:"High glucose represses the genes for maltose uptake and breakdown — IF/THEN logic at the DNA level, not inhibition of an existing enzyme."},
 {s:2,q:"Brewers aerate wort before pitching yeast mainly so the yeast can:",a:["Make sterols and unsaturated fatty acids","Carry out aerobic respiration","Kill contaminating bacteria","Carbonate the beer"],k:0,e:"The oxygen goes into membrane lipids — ergosterol and unsaturated fatty acids — not into respiration (Crabtree)."},
 {s:2,q:"The sterol yeast make for their membranes (their 'cholesterol') is:",a:["Ergosterol","Cholesterol","Lanosterol","Stigmasterol"],k:0,e:"Yeast use ergosterol; humans use cholesterol. Several ergosterol-synthesis steps require oxygen."},
 {s:2,q:"Isoamyl acetate gives which aroma, classic in hefeweizens?",a:["Banana","Clove","Rose","Pear skin"],k:0,e:"Isoamyl acetate = banana, made when alcohol acetyltransferase joins acetyl-CoA to isoamyl alcohol."},
 {s:2,q:"An ester forms from an alcohol plus:",a:["An organic acid (or acetyl-CoA)","A sugar","Oxygen","Another alcohol"],k:0,e:"Alcohol + acid → ester. In yeast the acyl group comes from acetyl-CoA for the common acetate esters."},
 {s:2,q:"Low oxygen — or underpitching yeast — tends to produce:",a:["More esters","Fewer esters","More sterols","Less ethanol"],k:0,e:"Less oxidation leaves more acetyl-CoA for the ester pathway. Some brewers underpitch on purpose for Belgian styles."},
 {s:2,q:"Fusel (higher) alcohols are byproducts of:",a:["Amino acid metabolism","Lipid synthesis","Glycolysis","Sterol synthesis"],k:0,e:"Fusels come from making and breaking amino acids. Fast growth — high temperature — raises them."},
 {s:2,q:"Which amino acid is converted into isoamyl alcohol, the precursor of the banana ester?",a:["Leucine","Valine","Methionine","Tyrosine"],k:0,e:"Leucine → isoamyl alcohol → isoamyl acetate. (Valine → isobutanol; tyrosine → tyrosol.)"},
 {s:2,q:"Which enzyme links acetyl-CoA to isoamyl alcohol to form the banana ester?",a:["Alcohol acetyltransferase","Alcohol dehydrogenase","Pyruvate decarboxylase","Maltase"],k:0,e:"Alcohol acetyltransferase. Its level varies widely by strain — more enzyme means more esters."},
 {s:2,q:"Unsaturated (double-bonded) fatty acids affect the yeast membrane by:",a:["Increasing its fluidity","Making it rigid","Blocking transport","Adding color"],k:0,e:"Double bonds kink the chains and raise fluidity — like oil vs. solid fat. Oxygen is needed to install them."},
 {s:2,q:"Why do some brewers add a trace of olive oil to their yeast?",a:["To supply unsaturated lipid building blocks in place of aerating","To add flavor","To kill bacteria","To raise the alcohol level"],k:0,e:"Olive oil provides unsaturated fatty acids, substituting for wort aeration — famously a toothpick-dip's worth for 5 gallons."},
 {s:3,q:"DMS — the 'cooked corn/cabbage' aroma — comes from:",a:["S-methyl methionine (SMM) in malt, released by heat","Sulfate in the water","Hop oils","Yeast breaking down cysteine"],k:0,e:"SMM forms in germinating barley; heat converts it to DMS. Pale/pilsner malt is high in SMM, so it needs a long boil."},
 {s:3,q:"To minimize DMS in the finished beer you should:",a:["Boil vigorously, uncovered, ~90 min, then cool fast","Cover the boil to trap aromas","Boil for a shorter time","Add corn as an adjunct"],k:0,e:"A long, open, rolling boil drives DMS off; rapid cooling stops SMM from making more during a slow cool-down."},
 {s:3,q:"Hydrogen sulfide (rotten-egg aroma) mostly comes from:",a:["Breakdown of sulfur-containing amino acids during fermentation","Sulfate in the water","Hop resins","Added bisulfite"],k:0,e:"H2S arises from sulfur amino-acid metabolism, worse when yeast lack vitamin B5 (pantothenate)."},
 {s:3,q:"Sulfate (SO4) in brewing water does what to flavor?",a:["Dries the beer and accentuates bitterness","Adds sweetness","Adds body and roundness","Reduces bitterness"],k:0,e:"Sulfate gives a crisp, dry, more bitter (astringent) character. NW Iowa / SW Minnesota groundwater can be very high in it."},
 {s:3,q:"Bisulfite added to beer acts mainly as a(n):",a:["Antioxidant that masks staling","Sweetener","Bittering agent","Yeast nutrient"],k:0,e:"Bisulfite reacts with carbonyl staling compounds, improving flavor stability."},
 {s:3,q:"The main staling compound in beer, tasting of 'wet cardboard', is:",a:["trans-2-nonenal","Diacetyl","Acetaldehyde","Dimethyl sulfide"],k:0,e:"trans-2-Nonenal forms from fat oxidation; bisulfite reacts with it to delay staling."},
 {s:3,q:"Which malt tends to be highest in SMM, so it needs the longest boil?",a:["Very pale / pilsner malt","Dark roasted malt","Crystal malt","Chocolate malt"],k:0,e:"Pale, lightly-kilned pilsner malt keeps more SMM, driving more DMS unless boiled long and hard."},
 {s:3,q:"Sulfate added to brewing water usually comes from gypsum, which is:",a:["Calcium sulfate (CaSO4)","Sodium chloride","Calcium carbonate","Magnesium oxide"],k:0,e:"Gypsum is CaSO4 — a common brewing-salt addition to raise sulfate and sharpen bitterness."},
 {s:3,q:"Mercaptans (thiols) in beer are generally described as:",a:["Skunky or garlicky","Fruity and sweet","Toasty and nutty","Floral"],k:0,e:"Thiols give skunky/sun-struck and garlic notes; they also form from sulfur amino-acid metabolism."},
 {s:3,q:"DMS is produced from S-methyl methionine, a derivative of which amino acid?",a:["Methionine","Cysteine","Leucine","Arginine"],k:0,e:"SMM derives from methionine in the germinating barley seed; heat converts SMM to DMS."},
 {s:4,q:"Gene editing (CRISPR) differs from making a transgenic organism because it:",a:["Adds no foreign DNA — just precise small edits","Always inserts a gene from another species","Uses random radiation to mutate","Clones whole organisms"],k:0,e:"Gene editing makes targeted changes with no foreign DNA; transgenics insert a gene from another species."},
 {s:4,q:"Transgenic modification specifically means:",a:["Inserting a foreign gene from another species","Editing a native gene with CRISPR","Breeding two strains","Exposing cells to UV light"],k:0,e:"Transgenic = a gene from one species placed into another (e.g. Bt corn carrying a bacterial gene)."},
 {s:4,q:"Overexpressing GPD1 in yeast boosts production of:",a:["Glycerol (sweeter wine, lower alcohol)","Ethanol","Esters","CO2"],k:0,e:"GPD1 overexpression gave a 4-fold rise in glycerol and lower ethanol — sweeter wine, lower-alcohol beer."},
 {s:4,q:"A GMO wine yeast approved in the US knocks out arginase to cut:",a:["Ethyl carbamate (urethane), a probable carcinogen","Methanol","Acetaldehyde","Histamine"],k:0,e:"Ethyl carbamate forms from ethanol + urea (from arginine). Removing arginase — or adding a bacterial urease — eliminates it."},
 {s:4,q:"Ethyl carbamate forms by a spontaneous reaction of ethanol with:",a:["Urea (from arginine breakdown)","Sulfate","Acetyl-CoA","Glycerol"],k:0,e:"Urea, released when arginase breaks down arginine, reacts with ethanol to form ethyl carbamate."},
 {s:4,q:"Golden Rice was engineered to make:",a:["Beta-carotene (provitamin A)","Vitamin C","Insulin","Bt insect toxin"],k:0,e:"Golden Rice makes beta-carotene, which ordinary rice lacks — aimed at vitamin A deficiency."},
 {s:4,q:"Bt corn carries an insect-toxin gene borrowed from which organism?",a:["Bacillus thuringiensis","Agrobacterium","Saccharomyces cerevisiae","E. coli"],k:0,e:"Bt corn expresses a toxin from the bacterium Bacillus thuringiensis — harmful to certain insects, not to humans."},
 {s:4,q:"'Roundup Ready' crops are engineered to tolerate which herbicide?",a:["Glyphosate","Atrazine","Paraquat","2,4-D"],k:0,e:"They carry an Agrobacterium enzyme that glyphosate (Roundup) does not inhibit."},
 {s:4,q:"Flocculation of brewing yeast is:",a:["Calcium-dependent, reversible clumping of cells into flocs","Yeast dying at high alcohol","Switching from maltose to glucose","Producing killer toxins"],k:0,e:"Flocculation is reversible, calcium-dependent aggregation via surface proteins; engineered timing clears the beer without stalling fermentation."},
 {s:4,q:"Overexpressing alcohol acetyltransferase in yeast increases:",a:["Acetate esters (e.g. banana isoamyl acetate)","Fusel alcohols","Glycerol","Hydrogen sulfide"],k:0,e:"More of this enzyme means more acetate esters — a GMO route to fruitier beer, sake and young wine."},
];
const RANKS=[{m:90,n:"BREWMASTER",t:"Perfect pour. The cellar bows to you."},{m:75,n:"HEAD BREWER",t:"Sharp. You run the brewhouse."},{m:60,n:"CELLAR HAND",t:"Solid — a few more batches and you're there."},{m:40,n:"APPRENTICE",t:"Promising. Keep sampling the material."},{m:0,n:"TOUR GUEST",t:"Early days. Hit continue and try again."}];
const ROUND=10,MIX=15,QTIME=15;
let S=null,timer=null,sound=true,best=load();

function load(){try{return +(localStorage.getItem("brewblitz.hi")||0)||0}catch(e){return 0}}
function saveHi(v){try{localStorage.setItem("brewblitz.hi",String(v))}catch(e){}}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function show(id){["start","game","results"].forEach(s=>$("#"+s).hidden=s!==id)}

/* audio */
let AC=null;
function beep(fr,d,t){if(!sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  fr.forEach((f,i)=>{const g=AC.createGain();g.gain.value=.0001;const o=AC.createOscillator();o.type=t||"square";o.frequency.value=f;
    o.connect(g);g.connect(AC.destination);const s=AC.currentTime+i*.06;g.gain.exponentialRampToValueAtTime(.12,s+.01);
    g.gain.exponentialRampToValueAtTime(.0001,s+d);o.start(s);o.stop(s+d)});}catch(e){}}
const sGood=()=>beep([660,880,1320],.18),sBad=()=>beep([160,90],.25,"sawtooth"),sClick=()=>beep([520],.05),sWin=()=>beep([523,659,784,1046,1319],.2);

/* particles */
const cv=$("#fx"),cx=cv.getContext("2d");let P=[],raf=null;
function sz(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio;cx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}
addEventListener("resize",sz);sz();
const reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;
const PC=["#29e7e7","#ff4fa3","#ffd23f","#4dffb0","#b483ff"];
function burst(x,y,n){if(reduce)return;for(let i=0;i<n;i++){const a=Math.random()*6.28,sp=3+Math.random()*7;
  P.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-3,g:.22,life:50+Math.random()*25,s:3+Math.random()*5,c:PC[i%PC.length]})}
  if(!raf)ploop();}
function ploop(){cx.clearRect(0,0,cv.width,cv.height);P=P.filter(p=>p.life>0);
  P.forEach(p=>{p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.life--;cx.globalAlpha=Math.min(1,p.life/25);cx.fillStyle=p.c;
    cx.fillRect(p.x,p.y,p.s,p.s)});cx.globalAlpha=1;if(P.length)raf=requestAnimationFrame(ploop);else{raf=null;cx.clearRect(0,0,cv.width,cv.height)}}

/* start */
function buildStart(){
  const g=$("#stages");g.innerHTML="";
  SUB.forEach((name,i)=>{const n=Q.filter(q=>q.s===i).length;
    const b=document.createElement("button");b.className="stage";b.style.borderColor=DOT[i];
    b.innerHTML=`<span class="num" style="background:${DOT[i]}">${i+1}</span><span><span class="nm"></span><span class="ct">${n} questions</span></span>`;
    b.querySelector(".nm").textContent=name;
    b.onclick=()=>{sClick();startRun(Q.map((q,qi)=>qi).filter(qi=>Q[qi].s===i),name)};g.appendChild(b);});
  $("#hi").textContent=best?("HI-SCORE  "+best.toLocaleString()):"";
}
$("#mixBtn").onclick=()=>{sClick();startRun(shuffle(Q.map((q,i)=>i)).slice(0,MIX),"Quick Mix")};
$("#allBtn").onclick=()=>{sClick();startRun(Q.map((q,i)=>i),"Marathon")};
$("#home").onclick=()=>{sClick();buildStart();show("start")};
$("#sound").onclick=()=>{sound=!sound;$("#sound").innerHTML=(sound?"&#128266; sound: on":"&#128263; sound: off");sClick()};

/* run */
function startRun(order,label){
  S={order:shuffle(order),idx:0,score:0,combo:0,best:0,correct:0,locked:false};
  show("game");render();
}
function render(){
  clearInterval(timer);
  const item=Q[S.order[S.idx]];S.locked=false;
  $("#qnum").textContent=(S.idx+1)+"/"+S.order.length;
  $("#combo").textContent="x"+Math.max(1,S.combo);
  $("#score").textContent=S.score.toLocaleString();
  const st=$("#subtag");st.textContent=SUB[item.s].toUpperCase();st.style.color=DOT[item.s];
  $("#qtext").textContent=item.q;
  $("#fb").hidden=true;
  const sh=shuffle(item.a.map((t,i)=>({t,correct:i===item.k})));S._opts=sh;
  const box=$("#opts");box.innerHTML="";
  sh.forEach((o,i)=>{const b=document.createElement("button");b.className="opt";b.type="button";
    b.innerHTML=`<span class="k">${"ABCD"[i]}</span><span class="tx"></span>`;
    b.querySelector(".tx").textContent=o.t;b.onclick=()=>choose(i);box.appendChild(b);});
  const bar=$("#tbar");bar.classList.remove("low");bar.style.width="100%";
  const t0=Date.now();
  timer=setInterval(()=>{const el=(Date.now()-t0)/1000;S.timeLeft=Math.max(0,QTIME-el);const p=S.timeLeft/QTIME*100;
    bar.style.width=p+"%";bar.classList.toggle("low",p<30);if(S.timeLeft<=0){clearInterval(timer);choose(-1)}},100);
}
function choose(i){
  if(S.locked)return;S.locked=true;clearInterval(timer);
  const item=Q[S.order[S.idx]],sh=S._opts,correct=(i>=0&&sh[i].correct);
  const btns=$("#opts").querySelectorAll(".opt");
  btns.forEach((b,bi)=>{b.disabled=true;if(sh[bi].correct)b.classList.add("correct");else if(bi===i)b.classList.add("wrong");else b.classList.add("dim");});
  const fb=$("#fb");fb.hidden=false;fb.classList.toggle("good",correct);fb.classList.toggle("bad",!correct);
  if(correct){
    S.correct++;S.combo++;S.best=Math.max(S.best,S.combo);
    const speed=Math.round(S.timeLeft/QTIME*100),mult=Math.min(S.combo,8);
    const gain=(100+speed)*mult;S.score+=gain;
    $("#verdict").textContent=S.combo>=3?("NICE!  x"+S.combo+" COMBO"):"CORRECT!";
    floatScore(gain);sGood();
    const r=$("#opts").getBoundingClientRect();burst(r.left+r.width/2,r.top+30,30);
    const cel=$(".combo");cel.classList.add("big");setTimeout(()=>cel.classList.remove("big"),200);
  }else{
    S.combo=0;$("#verdict").textContent=(i===-1)?"TIME'S UP!":"MISS!";sBad();
    if(!reduce){const cab=$("#cab");cab.classList.add("shake");setTimeout(()=>cab.classList.remove("shake"),400)}
  }
  $("#ex").textContent=item.e;
  $("#combo").textContent="x"+Math.max(1,S.combo);
  $("#score").textContent=S.score.toLocaleString();
  $("#nx").textContent=(S.idx+1>=S.order.length)?"Results ▶":"Next ▶";
  $("#nx").focus();
}
function floatScore(g){const el=$("#score"),r=el.getBoundingClientRect();const f=document.createElement("div");
  f.className="float";f.textContent="+"+g;f.style.left=(r.left-8)+"px";f.style.top=(r.top-4)+"px";document.body.appendChild(f);setTimeout(()=>f.remove(),1000)}
$("#nx").onclick=()=>{sClick();if(S.idx+1>=S.order.length){end();return}S.idx++;render()};
$("#again").onclick=()=>{sClick();startRun(S.order,"")};

function end(){
  show("results");
  const total=S.order.length,acc=Math.round(S.correct/total*100),rank=RANKS.find(r=>acc>=r.m);
  $("#rank").textContent=rank.n;$("#rankmsg").textContent=rank.t;
  $("#rAcc").textContent=acc+"%";$("#rCombo").textContent="x"+S.best;$("#rRight").textContent=S.correct+"/"+total;
  let cur=0;const target=S.score,fin=$("#fin"),step=Math.max(1,Math.round(target/40));
  const iv=setInterval(()=>{cur=Math.min(target,cur+step);fin.textContent=cur.toLocaleString();if(cur>=target)clearInterval(iv)},25);
  const hi=target>best;$("#newhi").hidden=!hi;if(hi){best=target;saveHi(best)}
  sWin();
  if(!reduce){let t=0;const party=setInterval(()=>{burst(Math.random()*innerWidth,innerHeight*.3+Math.random()*120,22);if(++t>=6)clearInterval(party)},170)}
}

addEventListener("keydown",e=>{
  if(!$("#game").hidden){
    if(!S.locked){const n="1234".indexOf(e.key);if(n>=0&&n<S._opts.length){choose(n);return}
      const a="abcd".indexOf(e.key.toLowerCase());if(a>=0&&a<S._opts.length){choose(a);return}}
    else if(e.key==="Enter"||e.key===" "){e.preventDefault();$("#nx").click()}
  }
});
buildStart();
</script>
