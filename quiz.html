<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BBMB 1200 Review Quiz</title>
<style>
  :root {
    --bg: #faf6ee; --card: #ffffff; --text: #2b2118; --muted: #76685a;
    --accent: #c47a14; --accent-soft: #fbe9c8; --line: #e6dccb;
    --right: #2e8b4a; --right-soft: #dff3e5; --wrong: #c23b2f; --wrong-soft: #fbe1de;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #1a1510; --card: #251e17; --text: #f1e8dc; --muted: #b3a593;
      --accent: #f0a63a; --accent-soft: #3b2c16; --line: #3c3127;
      --right: #5cc47c; --right-soft: #1f3526; --wrong: #ef6f63; --wrong-soft: #3d2120; color-scheme: dark; } }
  :root[data-theme="dark"] { --bg: #1a1510; --card: #251e17; --text: #f1e8dc; --muted: #b3a593;
      --accent: #f0a63a; --accent-soft: #3b2c16; --line: #3c3127;
      --right: #5cc47c; --right-soft: #1f3526; --wrong: #ef6f63; --wrong-soft: #3d2120; color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; line-height: 1.5; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 16px; }
  header { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  header h1 { font-size: 1.3rem; margin: 0; }
  a { color: var(--accent); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px; margin-top: 16px; }
  h2 { margin: 0 0 8px; font-size: 1.15rem; }
  .muted { color: var(--muted); }

  .subjects { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px; margin: 12px 0; }
  .subjects label { display: flex; gap: 10px; align-items: center; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; cursor: pointer; }
  .subjects label:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
  .subjects input { accent-color: var(--accent); width: 18px; height: 18px; }
  .subjects .count { margin-left: auto; color: var(--muted); font-size: .85rem; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 10px 0; }
  select { font: inherit; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--text); }

  .btn { font: inherit; font-weight: 600; border: 2px solid var(--accent); background: var(--accent); color: #fff; border-radius: 10px; padding: 10px 18px; cursor: pointer; }
  .btn.ghost { background: transparent; color: var(--accent); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .linkbtn { background: none; border: none; color: var(--accent); cursor: pointer; font: inherit; padding: 0; text-decoration: underline; }

  .progress { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; margin-top: 10px; }
  .progress div { height: 100%; background: var(--accent); width: 0; transition: width .3s; }
  .topline { display: flex; justify-content: space-between; font-size: .9rem; color: var(--muted); }
  .tag { display: inline-block; font-size: .78rem; background: var(--accent-soft); color: var(--accent); border-radius: 99px; padding: 2px 10px; margin-bottom: 8px; font-weight: 600; }
  .qtext { font-size: 1.15rem; font-weight: 600; margin: 4px 0 14px; }
  .choices { display: grid; gap: 10px; }
  .choice { font: inherit; text-align: left; border: 2px solid var(--line); background: var(--card); color: var(--text); border-radius: 10px; padding: 12px 14px; cursor: pointer; display: flex; gap: 10px; }
  .choice:hover:not(:disabled) { border-color: var(--accent); }
  .choice .letter { font-weight: 700; color: var(--accent); }
  .choice.correct { border-color: var(--right); background: var(--right-soft); }
  .choice.correct .letter { color: var(--right); }
  .choice.wrong { border-color: var(--wrong); background: var(--wrong-soft); }
  .choice.wrong .letter { color: var(--wrong); }
  .choice:disabled { cursor: default; }
  .feedback { margin-top: 14px; padding: 12px 14px; border-radius: 10px; }
  .feedback.ok { background: var(--right-soft); }
  .feedback.no { background: var(--wrong-soft); }
  .actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 14px; flex-wrap: wrap; }

  .score { font-size: 2.6rem; font-weight: 800; color: var(--accent); margin: 4px 0; }
  table { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: .95rem; }
  td, th { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); }
  td.num, th.num { text-align: right; }
  .missed { margin-top: 10px; }
  .missed li { margin-bottom: 10px; }
  .missed .ans { color: var(--right); font-weight: 600; }
  .missed .yours { color: var(--wrong); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🍺 BBMB 1200 Review Quiz</h1>
    <a href="index.html">← All quizzes</a>
  </header>

  <!-- Setup -->
  <section class="card" id="setup">
    <h2>Choose your subjects</h2>
    <p class="muted">Questions are drawn at random from the selected subjects, and answer choices are shuffled every time.</p>
    <div class="row">
      <button class="linkbtn" id="allBtn">Select all</button>
      <span class="muted">·</span>
      <button class="linkbtn" id="noneBtn">Clear</button>
    </div>
    <div class="subjects" id="subjects"></div>
    <div class="row">
      <label for="count">Number of questions:</label>
      <select id="count">
        <option value="10">10</option>
        <option value="25">25</option>
        <option value="50" selected>50</option>
        <option value="all">All available</option>
      </select>
      <label for="diff">Difficulty:</label>
      <select id="diff">
        <option value="1-5" selected>Mixed</option>
        <option value="1-2">Easier</option>
        <option value="3-5">Harder</option>
      </select>
    </div>
    <p class="muted" id="avail"></p>
    <button class="btn" id="startBtn">Start quiz</button>
  </section>

  <!-- Question -->
  <section class="card" id="quiz" hidden>
    <div class="topline"><span id="pos"></span><span id="running"></span></div>
    <div class="progress"><div id="bar"></div></div>
    <div style="margin-top:16px"><span class="tag" id="tag"></span></div>
    <div class="qtext" id="qtext"></div>
    <div class="choices" id="choices"></div>
    <div class="feedback" id="feedback" hidden></div>
    <div class="actions">
      <button class="btn ghost" id="quitBtn">End quiz</button>
      <button class="btn" id="nextBtn" hidden>Next →</button>
    </div>
  </section>

  <!-- Results -->
  <section class="card" id="results" hidden>
    <h2>Results</h2>
    <div class="score" id="score"></div>
    <p class="muted" id="scoreMsg"></p>
    <table id="breakdown"></table>
    <div class="actions" style="justify-content:flex-start">
      <button class="btn" id="retryMissedBtn">Retry missed questions</button>
      <button class="btn ghost" id="newBtn">New quiz</button>
    </div>
    <div id="missedWrap">
      <h2 style="margin-top:18px">Questions you missed</h2>
      <ol class="missed" id="missed"></ol>
    </div>
  </section>
</div>

<script src="questions.js"></script>
<script>
const $ = id => document.getElementById(id);
const LETTERS = ["A", "B", "C", "D"];
const PREF_KEY = "bbmb-quiz-prefs";
let session;

/** Two-step confirm (dialogs are blocked in some embeds): first click arms, second click acts. */
function confirmClick(btn, prompt, action) {
  if (btn.dataset.armed) { clearTimeout(+btn.dataset.armed); delete btn.dataset.armed; btn.textContent = btn.dataset.label; action(); return; }
  btn.dataset.label = btn.textContent;
  btn.textContent = prompt;
  btn.dataset.armed = setTimeout(() => { delete btn.dataset.armed; btn.textContent = btn.dataset.label; }, 3000);
}

// ── Setup ──
function buildSubjects() {
  const prefs = store.get(PREF_KEY, null);
  const box = $("subjects");
  for (const [key, name] of Object.entries(SUBJECTS)) {
    const n = QUESTIONS.filter(q => q.subject === key).length;
    const checked = prefs ? prefs.subjects.includes(key) : true;
    box.insertAdjacentHTML("beforeend",
      `<label><input type="checkbox" value="${key}" ${checked ? "checked" : ""}><span>${name}</span><span class="count">${n}</span></label>`);
  }
  if (prefs) { $("count").value = prefs.count; $("diff").value = prefs.diff; }
  box.addEventListener("change", updateAvail);
  $("diff").addEventListener("change", updateAvail);
  $("count").addEventListener("change", updateAvail);
  updateAvail();
}

function selectedSubjects() {
  return [...document.querySelectorAll("#subjects input:checked")].map(i => i.value);
}

function pool() {
  const subs = new Set(selectedSubjects());
  const [lo, hi] = $("diff").value.split("-").map(Number);
  return QUESTIONS.filter(q => subs.has(q.subject) && q.difficulty >= lo && q.difficulty <= hi);
}

function updateAvail() {
  const n = pool().length;
  const want = $("count").value === "all" ? n : Math.min(n, +$("count").value);
  $("avail").textContent = n
    ? `${n} questions available · this quiz will have ${want}.`
    : "Select at least one subject.";
  $("startBtn").disabled = n === 0;
}

/** Spread picks evenly across the chosen subjects, then shuffle. */
function drawBalanced(questions, count) {
  const bySubject = {};
  for (const q of shuffle(questions)) (bySubject[q.subject] ||= []).push(q);
  const lists = Object.values(bySubject);
  const out = [];
  while (out.length < count && lists.some(l => l.length)) {
    for (const l of shuffle(lists)) if (l.length && out.length < count) out.push(l.pop());
  }
  return shuffle(out);
}

function startQuiz(questions) {
  session = { list: questions, i: 0, right: 0, answers: [] };
  $("setup").hidden = true; $("results").hidden = true; $("quiz").hidden = false;
  showQuestion();
}

// ── Quiz ──
function showQuestion() {
  const q = session.list[session.i];
  const { choices, answerIndex } = shuffledChoices(q);
  session.current = { q, choices, answerIndex };
  $("pos").textContent = `Question ${session.i + 1} of ${session.list.length}`;
  $("running").textContent = session.i ? `${session.right} / ${session.i} correct` : "";
  $("bar").style.width = (session.i / session.list.length * 100) + "%";
  $("tag").textContent = SUBJECTS[q.subject];
  $("qtext").textContent = q.q;
  const box = $("choices");
  box.innerHTML = "";
  choices.forEach((c, i) => {
    const b = document.createElement("button");
    b.className = "choice";
    b.innerHTML = `<span class="letter">${LETTERS[i]}</span>`;
    const t = document.createElement("span"); t.textContent = c; b.append(t);
    b.onclick = () => answer(i);
    box.append(b);
  });
  $("feedback").hidden = true;
  $("nextBtn").hidden = true;
}

function answer(i) {
  const { q, choices, answerIndex } = session.current;
  const right = i === answerIndex;
  if (right) session.right++;
  session.answers.push({ q, right, chosen: choices[i] });
  const buttons = [...$("choices").children];
  buttons.forEach(b => b.disabled = true);
  buttons[answerIndex].classList.add("correct");
  if (!right) buttons[i].classList.add("wrong");
  const fb = $("feedback");
  fb.hidden = false;
  fb.className = "feedback " + (right ? "ok" : "no");
  fb.innerHTML = `<strong>${right ? "Correct!" : `Not quite — the answer is ${LETTERS[answerIndex]}.`}</strong> `;
  fb.append(document.createTextNode(q.explain));
  $("running").textContent = `${session.right} / ${session.i + 1} correct`;
  $("nextBtn").hidden = false;
  $("nextBtn").textContent = session.i + 1 < session.list.length ? "Next →" : "See results";
  $("nextBtn").focus();
}

function next() {
  session.i++;
  if (session.i < session.list.length) showQuestion(); else showResults();
}

// ── Results ──
function showResults() {
  $("quiz").hidden = true; $("results").hidden = false;
  const total = session.answers.length;
  const pct = total ? Math.round(session.right / total * 100) : 0;
  $("score").textContent = `${session.right} / ${total} (${pct}%)`;
  $("scoreMsg").textContent = !total ? "No questions answered."
    : pct >= 90 ? "Excellent — you're ready for the exam! 🍻"
    : pct >= 75 ? "Solid work. Review the misses below."
    : pct >= 60 ? "Getting there — revisit the subjects with lower scores."
    : "Keep studying: try a smaller set by subject.";

  const by = {};
  for (const a of session.answers) {
    const s = (by[a.q.subject] ||= { right: 0, total: 0 });
    s.total++; if (a.right) s.right++;
  }
  $("breakdown").innerHTML = `<tr><th>Subject</th><th class="num">Score</th></tr>` +
    Object.entries(by).map(([k, s]) =>
      `<tr><td>${SUBJECTS[k]}</td><td class="num">${s.right} / ${s.total} (${Math.round(s.right / s.total * 100)}%)</td></tr>`).join("");

  const missed = session.answers.filter(a => !a.right);
  $("missedWrap").hidden = missed.length === 0;
  $("retryMissedBtn").hidden = missed.length === 0;
  const ol = $("missed");
  ol.innerHTML = "";
  for (const a of missed) {
    const li = document.createElement("li");
    const qd = document.createElement("div"); qd.textContent = a.q.q;
    const yd = document.createElement("div"); yd.className = "yours"; yd.textContent = "Your answer: " + a.chosen;
    const cd = document.createElement("div"); cd.className = "ans"; cd.textContent = "Correct: " + a.q.correct;
    const ed = document.createElement("div"); ed.className = "muted"; ed.textContent = a.q.explain;
    li.append(qd, yd, cd, ed);
    ol.append(li);
  }
  session.missed = missed.map(a => a.q);
}

// ── Wiring ──
buildSubjects();
$("allBtn").onclick = () => { document.querySelectorAll("#subjects input").forEach(i => i.checked = true); updateAvail(); };
$("noneBtn").onclick = () => { document.querySelectorAll("#subjects input").forEach(i => i.checked = false); updateAvail(); };
$("startBtn").onclick = () => {
  const p = pool();
  const n = $("count").value === "all" ? p.length : Math.min(p.length, +$("count").value);
  store.set(PREF_KEY, { subjects: selectedSubjects(), count: $("count").value, diff: $("diff").value });
  startQuiz(drawBalanced(p, n));
};
$("nextBtn").onclick = next;
$("quitBtn").onclick = () => confirmClick($("quitBtn"), "Tap again to end", showResults);
$("retryMissedBtn").onclick = () => startQuiz(shuffle(session.missed));
$("newBtn").onclick = () => { $("results").hidden = true; $("setup").hidden = false; updateAvail(); };
document.addEventListener("keydown", e => {
  if ($("quiz").hidden) return;
  const k = e.key.toUpperCase();
  const idx = LETTERS.indexOf(k);
  if (idx >= 0 || ["1", "2", "3", "4"].includes(e.key)) {
    const i = idx >= 0 ? idx : +e.key - 1;
    const b = $("choices").children[i];
    if (b && !b.disabled) b.click();
  } else if (e.key === "Enter" && !$("nextBtn").hidden && document.activeElement !== $("nextBtn")) {
    next();
  }
});
</script>
</body>
</html>
